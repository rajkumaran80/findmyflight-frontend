name: Build and deploy Docker image to Azure Web App - findmyflight-frontend-prod

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_88B0490C2300499297CD60C10F5B63E2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_471E6115541648CFAC6A98BE714A72B7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D463BC6FC13048C3B048C3D8E9CABA0F }}

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        run: |
          IMAGE=${{ secrets.ACR_NAME }}.azurecr.io/findmyflight-frontend:${{ github.sha }}
          LATEST=${{ secrets.ACR_NAME }}.azurecr.io/findmyflight-frontend:latest
          docker build -t $IMAGE -t $LATEST .
          docker push $IMAGE
          docker push $LATEST

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'findmyflight-frontend-prod'
          slot-name: 'Production'
          images: '${{ secrets.ACR_NAME }}.azurecr.io/findmyflight-frontend:${{ github.sha }}'
